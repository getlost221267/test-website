a{color:inherit}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px clamp(16px,5vw,56px)}
.logo{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem;text-decoration:none;letter-spacing:.02em}
.nav{display:flex;gap:12px;flex-wrap:wrap}

.btn{display:inline-block;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.1rem;text-decoration:none;
  padding:10px 20px;border:3px solid var(--shadow);background:var(--panel);color:var(--text);
  box-shadow:5px 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--ember);color:var(--ember-ink)}

.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px clamp(16px,5vw,56px) 80px;max-width:1100px;margin:0 auto}
.creator{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px}
.clabel{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ember)}
.creator img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.cname{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem}
.creator.small{margin:0 auto 48px;padding:20px 32px;gap:10px;width:min(560px,calc(100% - 32px));background:var(--panel);border:3px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.creator.small .clabel{font-size:.95rem}
.creator.small img{width:100px;height:100px;border-width:3px;box-shadow:4px 4px 0 var(--shadow)}
.creator.small .cname{font-size:1.25rem}
.row.buttons{flex-wrap:nowrap;gap:12px;margin-top:18vh;width:100%;max-width:760px;justify-content:center}
.row.buttons .btn{flex:1 1 0;min-width:0;text-align:center;padding-left:8px;padding-right:8px}
@media (max-width:560px){.row.buttons{flex-wrap:wrap}.row.buttons .btn{flex:1 1 40%}}
.hero h1{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(3.2rem,13vw,9rem);line-height:.95;margin:0 0 24px;letter-spacing:-.01em;
  text-shadow:6px 6px 0 var(--shadow)}
.brand{display:flex;align-items:baseline;justify-content:center;gap:.15em;margin:0 0 24px}
.brand h1{margin:0}
.tld{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(1.1rem,3.6vw,2.4rem);color:var(--muted);letter-spacing:.02em;animation:fadeUp .5s ease-out backwards;animation-delay:1.4s}
@media (prefers-reduced-motion:reduce){.tld{animation:none!important}}
.hero p{font-size:1.2rem;max-width:34ch;color:var(--muted);margin:0 0 32px}
.hint{font-family:"Pixelify Sans",monospace;color:var(--muted);margin-top:56px}

section.clients{padding:80px clamp(16px,5vw,56px) 96px}
.card{max-width:760px;margin:0 auto;background:var(--panel);border:3px solid var(--shadow);box-shadow:10px 10px 0 var(--shadow);padding:clamp(24px,5vw,48px)}
.card.socials,.card.middle,.card.rat,.card.first,.card.launchers{margin-top:48px}
.card.install{padding-top:20px;padding-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card.install h2{margin:0;font-size:clamp(1.5rem,5vw,2.2rem)}
.card.featured{margin-top:48px;text-align:center}
.creator{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.creator img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.cname{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem}
.row{display:flex;gap:16px;flex-wrap:wrap}
.card h2{font-family:"Pixelify Sans",monospace;font-size:clamp(1.9rem,6vw,3rem);line-height:1.05;margin:0 0 16px}
.version{display:inline-block;background:var(--ember);color:var(--ember-ink);font-family:"Pixelify Sans",monospace;font-weight:700;padding:2px 12px;margin-bottom:20px;border:3px solid var(--shadow)}
.card p{color:var(--muted);margin:0 0 20px;max-width:52ch}
.card p.includes{color:var(--text);font-weight:700;margin-bottom:28px}

footer{text-align:center;padding:32px 16px 48px;color:var(--muted);font-size:.95rem}
footer a{color:var(--text)}




@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

button.btn{cursor:pointer;line-height:inherit}
.row.buttons{position:relative}
.dd{flex:1 1 0;min-width:0}
.dd>.btn{width:100%;text-align:center;padding-left:8px;padding-right:8px}
.dd-menu{position:absolute;top:calc(100% + 12px);left:0;right:0;z-index:20;display:flex;flex-direction:row;justify-content:center;gap:12px;visibility:hidden;pointer-events:none}
.dd-menu .btn{text-align:center;white-space:nowrap;flex:0 1 auto;padding-left:24px;padding-right:24px;opacity:0;transform:translateY(-14px) scale(.96);transition:opacity .22s ease,transform .3s cubic-bezier(.2,.9,.3,1.2),box-shadow .08s}
.dd.open .dd-menu{visibility:visible;pointer-events:auto}
.dd.open .dd-menu .btn{opacity:1;transform:none}
.dd.open .dd-menu .btn:nth-child(2){transition-delay:.07s,.07s,0s}
.dd.open .dd-menu .btn:nth-child(3){transition-delay:.14s,.14s,0s}
.dd:not(.open) .dd-menu{transition:visibility 0s .3s}
@media (max-width:560px){.dd{flex:1 1 40%}.dd-menu{flex-wrap:wrap}.dd-menu .btn{flex:1 1 auto;padding-left:8px;padding-right:8px;font-size:1rem}}
@media (prefers-reduced-motion:reduce){.dd-menu .btn{transition:none!important}.dd:not(.open) .dd-menu{transition:none}}
.btn.blank{visibility:hidden}
.btn.off{opacity:.45;cursor:default;pointer-events:none}
dialog.pop{border:3px solid var(--shadow);background:var(--panel);color:var(--text);box-shadow:10px 10px 0 var(--shadow);padding:clamp(20px,5vw,36px);width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog.pop::backdrop{background:rgba(0,0,0,.75)}
dialog.pop h2{font-family:"Pixelify Sans",monospace;font-size:2rem;margin:0 0 20px}
.pfp{padding:0;margin:0;border:0;background:none;color:inherit;cursor:pointer;border-radius:50%;line-height:0}
.pfp img{display:block;transition:transform .08s}
.pfp:hover img{transform:scale(1.05)}
.pfp:active img{transform:scale(.97)}
#kebabDialog{text-align:center}
#kebabDialog h2{font-size:2.6rem;margin:0 0 20px}
.people{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.person{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:140px;text-align:center}
.person .cname{overflow-wrap:anywhere}
.person a.cname{text-decoration:none}
.av{width:100px;height:100px;border-radius:50%;border:3px solid var(--shadow);box-shadow:4px 4px 0 var(--shadow);display:grid;place-items:center;background:var(--bg);color:var(--ember);font-family:"Pixelify Sans",monospace;font-weight:700;font-size:2.4rem;line-height:1}
.person .btn{font-size:.8rem;padding:4px 10px;border-width:2px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.addform{width:100%;margin-top:6px;display:flex;flex-direction:column;gap:10px}
.addform .field{display:block;width:100%;font:inherit;padding:10px 12px;background:var(--bg);color:var(--text);border:3px solid var(--shadow)}
.addform p{margin:0;min-height:1.4em;color:var(--muted);text-align:center}
#socialsDialog{max-height:calc(100% - 32px);overflow-y:auto}
.soc-editor{display:flex;flex-direction:column;gap:14px;margin:18px 0 0;padding-top:18px;border-top:3px solid var(--shadow)}
.soc-row{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:2px dashed var(--shadow)}
.soc-editor .field{display:block;width:100%;font:inherit;padding:10px 12px;background:var(--bg);color:var(--text);border:3px solid var(--shadow)}
.soc-editor .chk{display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--muted)}
.soc-editor .chk input{width:20px;height:20px;accent-color:var(--ember)}
.soc-editor .acts{display:flex;gap:10px;flex-wrap:wrap}
.soc-editor .btn,.soc-edit-btn{cursor:pointer}
.soc-editor .btn{font-size:.85rem;padding:6px 12px;border-width:2px;box-shadow:3px 3px 0 var(--shadow)}
.soc-edit-btn{margin-top:14px;width:100%;text-align:center}
.soc-editor p{margin:0;min-height:1.4em;color:var(--muted)}
.role{font-family:"Pixelify Sans",monospace;font-size:.9rem;color:var(--muted);margin-top:-6px;letter-spacing:.08em;text-transform:uppercase}
.addform .filebtn{font-size:.85rem;padding:6px 12px;border-width:2px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;align-self:flex-start}
.addform .fileinfo{color:var(--muted);font-size:.9rem;display:flex;gap:10px;align-items:center}
.addform .fileinfo img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--shadow)}
.heart{background:none;border:0;padding:0;margin:0;font-size:inherit;line-height:1;cursor:pointer;color:inherit;transition:transform .08s}
.heart:active{transform:scale(1.35)}
.pop-input{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;background:var(--bg);color:var(--text);border:3px solid var(--shadow);margin:0 0 12px}
#codeMsg{min-height:1.6em;margin:0 0 12px;color:var(--muted)}
.pop-actions{display:flex;gap:12px;flex-wrap:wrap}
.pop-actions .btn{flex:1 1 120px;text-align:center;cursor:pointer;line-height:inherit}
.pop-links{display:flex;flex-direction:column;gap:14px}
.pop-links .btn{text-align:center}
.pop-close{margin-top:20px;width:100%}

/* ===== Animaties ===== */
[data-type]{white-space:nowrap}
.l{display:inline-block;animation:letterIn .32s steps(4,end) backwards;animation-delay:calc(250ms + var(--i) * 110ms)}
@keyframes letterIn{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
main{animation:pageIn .45s ease-out backwards;transition:opacity .28s ease-in,transform .28s ease-in}
header{transition:opacity .28s ease-in}
body.leaving main{opacity:0;transform:translateY(-18px)}
body.leaving header{opacity:0}
.row.buttons{animation:fadeUp .5s ease-out backwards;animation-delay:1.3s}
.creator.small{animation:fadeUp .5s ease-out backwards;animation-delay:1.6s}
.page .card{animation:fadeUp .5s ease-out backwards;animation-delay:calc(.6s + var(--n,0) * 80ms)}
@media (prefers-reduced-motion:reduce){
  .l,main,.row.buttons,.creator.small,.page .card,dialog.pop,dialog.pop::backdrop{animation:none!important}
  main,header{transition:none!important}
}

@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
dialog.pop[open]{animation:popIn .25s cubic-bezier(.2,.9,.3,1.2)}
dialog.pop[open]::backdrop{animation:fadeIn .25s ease-out}
dialog.pop.closing{animation:popOut .18s ease-in forwards}
dialog.pop.closing::backdrop{animation:fadeOut .18s ease-in forwards}
</style>

<script>
(function(){
  var KEY='dk_socials',links=document.querySelector('#socialsDialog .pop-links');
  var dlg=document.getElementById('socialsDialog');
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var admin=get('dk_admin')==='1';
  var defaults=[].map.call(links.children,function(x){
    return{n:x.textContent.trim(),l:x.tagName==='A'?x.getAttribute('href'):'',p:x.classList.contains('primary')}});
  var data;try{data=JSON.parse(get(KEY))}catch(e){data=null}
  if(!Array.isArray(data))data=defaults.map(function(x){return{n:x.n,l:x.l,p:x.p}});
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function clean(u){u=(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;
    try{var x=new URL(u);return(x.protocol==='http:'||x.protocol==='https:')?x.href:null}catch(e){return null}}
  function render(){
    links.textContent='';
    data.forEach(function(it){
      var e;
      if(it.l){e=el('a','btn'+(it.p?' primary':''),it.n);e.href=it.l;e.target='_blank';e.rel='noopener noreferrer'}
      else{e=el('span','btn off'+(it.p?' primary':''),it.n);e.setAttribute('aria-disabled','true')}
      links.appendChild(e);
    });
  }
  if(!get(KEY)&&!admin)return;
  render();
  if(!admin)return;
  var editor=null,eb=el('button','btn soc-edit-btn','Edit socials');eb.type='button';
  links.after(eb);
  function save(arr){data=arr;put(KEY,JSON.stringify(arr));render()}
  function row(it){
    var r=el('div','soc-row');
    var n=el('input','field');n.type='text';n.placeholder='Name';n.value=it.n||'';n.setAttribute('aria-label','Name');
    var l=el('input','field');l.type='text';l.placeholder='Link (empty = greyed out)';l.value=it.l||'';l.setAttribute('aria-label','Link');
    var lb=el('label','chk');var c=el('input');c.type='checkbox';c.checked=!!it.p;lb.appendChild(c);lb.appendChild(el('span','','Highlight'));
    var d=el('button','btn','Delete');d.type='button';d.addEventListener('click',function(){r.remove()});
    r._get=function(){return{n:n.value.trim(),l:l.value,p:c.checked}};
    [n,l,lb,d].forEach(function(x){r.appendChild(x)});
    return r;
  }
  function close(){if(editor){editor.remove();editor=null}}
  eb.addEventListener('click',function(){
    if(editor){close();return}
    editor=el('div','soc-editor');
    var rows=el('div');rows.style.cssText='display:flex;flex-direction:column;gap:14px';
    data.forEach(function(it){rows.appendChild(row(it))});
    var msg=el('p','');msg.setAttribute('role','status');
    var acts=el('div','acts');
    var add=el('button','btn','Add social');add.type='button';add.addEventListener('click',function(){rows.appendChild(row({}))});
    var sv=el('button','btn primary','Save');sv.type='button';
    sv.addEventListener('click',function(){
      var out=[];
      for(var i=0;i<rows.children.length;i++){
        var v=rows.children[i]._get(),ll=clean(v.l);
        if(!v.n){msg.textContent='Every social needs a name.';return}
        if(ll===null){msg.textContent='Check the link of "'+v.n+'".';return}
        out.push({n:v.n,l:ll,p:v.p});
      }
      save(out);close();
    });
    var rs=el('button','btn','Reset');rs.type='button';
    rs.addEventListener('click',function(){try{localStorage.removeItem(KEY)}catch(e){}data=defaults.map(function(x){return{n:x.n,l:x.l,p:x.p}});render();close()});
    var cn=el('button','btn','Cancel');cn.type='button';cn.addEventListener('click',close);
    [add,sv,rs,cn].forEach(function(x){acts.appendChild(x)});
    editor.appendChild(rows);editor.appendChild(msg);editor.appendChild(acts);
    eb.after(editor);
  });
  dlg.addEventListener('close',close);
})();

(function(){
  var KEY='dk_featured';
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var admin=get('dk_admin')==='1';
  var list;try{list=JSON.parse(get(KEY)||'[]')}catch(e){list=[]}
  if(!Array.isArray(list))list=[];
  if(!admin&&!list.length)return;
  var box=document.querySelector('.creator.small'),people=document.getElementById('people');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function clean(u){u=(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;
    try{var x=new URL(u);return(x.protocol==='http:'||x.protocol==='https:')?x.href:null}catch(e){return null}}
  function save(){put(KEY,JSON.stringify(list))}
  function render(){
    people.querySelectorAll('.person.added').forEach(function(p){p.remove()});
    list.forEach(function(it,i){
      var p=el('div','person added'),av;
      if(it[2]){av=el('img');av.src=it[2];av.alt=it[0];av.width=100;av.height=100;av.addEventListener('error',function(){var f=el('span','av',it[0].charAt(0).toUpperCase());av.replaceWith(f)})}
      else av=el('span','av',it[0].charAt(0).toUpperCase());
      var nm;
      if(it[1]){var a=el('a');a.href=it[1];a.target='_blank';a.rel='noopener noreferrer';a.appendChild(av);p.appendChild(a);
        nm=el('a','cname',it[0]);nm.href=it[1];nm.target='_blank';nm.rel='noopener noreferrer'}
      else{p.appendChild(av);nm=el('span','cname',it[0])}
      p.appendChild(nm);
      if(admin){var d=el('button','btn','Remove');d.type='button';
        d.addEventListener('click',function(){list.splice(i,1);save();render()});p.appendChild(d)}
      people.appendChild(p);
    });
  }
  if(admin){
    var f=el('div','addform');
    var n=el('input','field');n.type='text';n.placeholder='Name';n.setAttribute('aria-label','Name');
    var u=el('input','field');u.type='text';u.placeholder='Link (optional)';u.setAttribute('aria-label','Link');
    var im=el('input','field');im.type='text';im.placeholder='Or a picture link (optional)';im.setAttribute('aria-label','Picture link');
    var pic='',fi=el('input');fi.type='file';fi.accept='image/*';fi.hidden=true;
    var fb=el('button','btn filebtn','Import picture');fb.type='button';
    var info=el('div','fileinfo');
    fb.addEventListener('click',function(){fi.click()});
    fi.addEventListener('change',function(){
      var file=fi.files&&fi.files[0];if(!file)return;
      if(!/^image\//.test(file.type)){msg.textContent='Choose an image file.';return}
      var rd=new FileReader();
      rd.onload=function(){
        var img=new Image();
        img.onload=function(){
          var m=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=200;
          c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,200,200);
          pic=c.toDataURL('image/jpeg',0.85);
          info.textContent='';var pv=el('img');pv.src=pic;pv.alt='';info.appendChild(pv);info.appendChild(el('span','',file.name));
          msg.textContent='';
        };
        img.onerror=function(){msg.textContent='Could not read that image.'};
        img.src=rd.result;
      };
      rd.readAsDataURL(file);
    });
    var msg=el('p','');msg.setAttribute('role','status');
    var b=el('button','btn primary','Add creator');b.type='button';
    b.addEventListener('click',function(){
      var nn=n.value.trim(),uu=clean(u.value),ii=pic||clean(im.value);
      if(!nn){msg.textContent='Enter a name.';return}
      if(uu===null||ii===null){msg.textContent='Enter a valid link.';return}
      list.push([nn,uu,ii]);save();n.value='';u.value='';im.value='';pic='';fi.value='';info.textContent='';msg.textContent='';render();
    });
    f.appendChild(n);f.appendChild(u);f.appendChild(fb);f.appendChild(fi);f.appendChild(info);f.appendChild(im);f.appendChild(msg);f.appendChild(b);
    box.appendChild(f);
  }
  render();
})();

(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var k=document.getElementById('kebabDialog'),c=document.getElementById('codeDialog');
  var inp=document.getElementById('codeInput'),msg=document.getElementById('codeMsg');
  var ok=document.getElementById('codeOk'),cancel=document.getElementById('codeCancel');
  var n=0,CODE='ilovekebab123';
  var armed=false;
  document.querySelector('.tld').addEventListener('click',function(){armed=true});
  function closeAnim(d){
    if(!d.open||d.classList.contains('closing'))return;
    if(reduce){d.close();return}
    d.classList.add('closing');
    setTimeout(function(){d.classList.remove('closing');d.close()},180);
  }
  k.addEventListener('close',function(){n=0});
  document.getElementById('heartBtn').addEventListener('click',function(){
    if(!armed)return;
    n++;
    if(n>=10){
      n=0;armed=false;k.close();
      inp.value='';inp.hidden=false;ok.disabled=false;msg.textContent='';cancel.textContent='Cancel';
      c.showModal();inp.focus();
    }
  });
  function submit(){
    if(inp.value===CODE){
      try{localStorage.setItem('dk_admin','1');msg.textContent='Admin mode is on. Open Clients or FAQ to edit.'}
      catch(e){msg.textContent='Your browser blocked saving, so admin mode cannot be turned on.'}
      inp.hidden=true;ok.disabled=true;cancel.textContent='Close';
    }else{msg.textContent='Wrong code.';inp.select()}
  }
  ok.addEventListener('click',submit);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
  cancel.addEventListener('click',function(){closeAnim(c)});
  c.addEventListener('click',function(e){if(e.target===c)closeAnim(c)});
  c.addEventListener('cancel',function(e){e.preventDefault();closeAnim(c)});
})();

(function(){

(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Titel letter voor letter
  document.querySelectorAll('[data-type]').forEach(function(el){
    var text = el.textContent.trim();
    el.setAttribute('aria-label', text);
    el.textContent = '';
    text.split('').forEach(function(ch, i){
      var s = document.createElement('span');
      s.className = 'l';
      s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--i', i);
      s.textContent = ch;
      el.appendChild(s);
    });
  });

  // Kaarten na elkaar in beeld
  document.querySelectorAll('.page .card').forEach(function(c, i){ c.style.setProperty('--n', i); });

  // Pagina-overgang bij interne links
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (a.target && a.target !== '_self') return;
    if (a.protocol !== location.protocol || a.host !== location.host) return;
    if (a.pathname === location.pathname) return;
    e.preventDefault();
    if (reduce) { location.href = a.href; return; }
    document.body.classList.add('leaving');
    setTimeout(function(){ location.href = a.href; }, 280);
  });
  window.addEventListener('pageshow', function(){ document.body.classList.remove('leaving'); });
})();
