a{color:inherit}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px clamp(16px,5vw,56px)}
.logo{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem;text-decoration:none;letter-spacing:.02em}
.nav{display:flex;gap:12px;flex-wrap:wrap}

.btn{display:inline-block;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.1rem;text-decoration:none;
  padding:10px 20px;border:3px solid var(--shadow);background:var(--panel);color:var(--text);
  box-shadow:5px 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--ember);color:var(--ember-ink)}

.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px clamp(16px,5vw,56px) 80px;max-width:1100px;margin:0 auto}
.creator{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px}
.clabel{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ember)}
.creator img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.cname{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem}
.creator.small{margin:0 auto 48px;padding:20px 32px;gap:10px;width:min(560px,calc(100% - 32px));background:var(--panel);border:3px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.creator.small .clabel{font-size:.95rem}
.creator.small img{width:100px;height:100px;border-width:3px;box-shadow:4px 4px 0 var(--shadow)}
.creator.small .cname{font-size:1.25rem}
.row.buttons{flex-wrap:nowrap;gap:12px;margin-top:18vh;width:100%;max-width:760px;justify-content:center}
.row.buttons .btn{flex:1 1 0;min-width:0;text-align:center;padding-left:8px;padding-right:8px}
@media (max-width:560px){.row.buttons{flex-wrap:wrap}.row.buttons .btn{flex:1 1 40%}}
.hero h1{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(3.2rem,13vw,9rem);line-height:.95;margin:0 0 24px;letter-spacing:-.01em;
  text-shadow:6px 6px 0 var(--shadow)}
.brand{display:flex;align-items:baseline;justify-content:center;gap:.15em;margin:0 0 24px}
.brand h1{margin:0}
.tld{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(1.1rem,3.6vw,2.4rem);color:var(--muted);letter-spacing:.02em;animation:fadeUp .5s ease-out backwards;animation-delay:1.4s}
@media (prefers-reduced-motion:reduce){.tld{animation:none!important}}
.hero p{font-size:1.2rem;max-width:34ch;color:var(--muted);margin:0 0 32px}
.hint{font-family:"Pixelify Sans",monospace;color:var(--muted);margin-top:56px}

section.clients{padding:80px clamp(16px,5vw,56px) 96px}
.card{max-width:760px;margin:0 auto;background:var(--panel);border:3px solid var(--shadow);box-shadow:10px 10px 0 var(--shadow);padding:clamp(24px,5vw,48px)}
.card.socials,.card.middle,.card.rat,.card.first,.card.launchers{margin-top:48px}
.card.install{padding-top:20px;padding-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card.install h2{margin:0;font-size:clamp(1.5rem,5vw,2.2rem)}
.card.featured{margin-top:48px;text-align:center}
.creator{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.creator img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.cname{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem}
.row{display:flex;gap:16px;flex-wrap:wrap}
.card h2{font-family:"Pixelify Sans",monospace;font-size:clamp(1.9rem,6vw,3rem);line-height:1.05;margin:0 0 16px}
.version{display:inline-block;background:var(--ember);color:var(--ember-ink);font-family:"Pixelify Sans",monospace;font-weight:700;padding:2px 12px;margin-bottom:20px;border:3px solid var(--shadow)}
.card p{color:var(--muted);margin:0 0 20px;max-width:52ch}
.card p.includes{color:var(--text);font-weight:700;margin-bottom:28px}

footer{text-align:center;padding:32px 16px 48px;color:var(--muted);font-size:.95rem}
footer a{color:var(--text)}




@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

button.btn{cursor:pointer;line-height:inherit}
.btn.blank{visibility:hidden}
.btn.off{opacity:.45;cursor:default;pointer-events:none}
dialog.pop{border:3px solid var(--shadow);background:var(--panel);color:var(--text);box-shadow:10px 10px 0 var(--shadow);padding:clamp(20px,5vw,36px);width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog.pop::backdrop{background:rgba(0,0,0,.75)}
dialog.pop h2{font-family:"Pixelify Sans",monospace;font-size:2rem;margin:0 0 20px}
.pop-links{display:flex;flex-direction:column;gap:14px}
.pop-links .btn{text-align:center}
.pop-close{margin-top:20px;width:100%}

/* ===== Animaties ===== */
[data-type]{white-space:nowrap}
.l{display:inline-block;animation:letterIn .32s steps(4,end) backwards;animation-delay:calc(250ms + var(--i) * 110ms)}
@keyframes letterIn{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
main{animation:pageIn .45s ease-out backwards;transition:opacity .28s ease-in,transform .28s ease-in}
header{transition:opacity .28s ease-in}
body.leaving main{opacity:0;transform:translateY(-18px)}
body.leaving header{opacity:0}
.row.buttons{animation:fadeUp .5s ease-out backwards;animation-delay:1.3s}
.creator.small{animation:fadeUp .5s ease-out backwards;animation-delay:1.6s}
.page .card{animation:fadeUp .5s ease-out backwards;animation-delay:calc(.6s + var(--n,0) * 80ms)}
@media (prefers-reduced-motion:reduce){
  .l,main,.row.buttons,.creator.small,.page .card,dialog.pop,dialog.pop::backdrop{animation:none!important}
  main,header{transition:none!important}
}

@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
dialog.pop[open]{animation:popIn .25s cubic-bezier(.2,.9,.3,1.2)}
dialog.pop[open]::backdrop{animation:fadeIn .25s ease-out}
dialog.pop.closing{animation:popOut .18s ease-in forwards}
dialog.pop.closing::backdrop{animation:fadeOut .18s ease-in forwards}
</style>
</head>

<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var d = document.getElementById('socialsDialog');
  function closeAnimated(){
    if (!d.open || d.classList.contains('closing')) return;
    if (reduce) { d.close(); return; }
    d.classList.add('closing');
    setTimeout(function(){ d.classList.remove('closing'); d.close(); }, 180);
  }
  document.getElementById('socialsBtn').addEventListener('click', function(){ d.showModal(); });
  document.getElementById('socialsClose').addEventListener('click', closeAnimated);
  d.addEventListener('click', function(e){ if (e.target === d) closeAnimated(); });
  d.addEventListener('cancel', function(e){ e.preventDefault(); closeAnimated(); });
})();

(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Titel letter voor letter
  document.querySelectorAll('[data-type]').forEach(function(el){
    var text = el.textContent.trim();
    el.setAttribute('aria-label', text);
    el.textContent = '';
    text.split('').forEach(function(ch, i){
      var s = document.createElement('span');
      s.className = 'l';
      s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--i', i);
      s.textContent = ch;
      el.appendChild(s);
    });
  });

  // Kaarten na elkaar in beeld
  document.querySelectorAll('.page .card').forEach(function(c, i){ c.style.setProperty('--n', i); });

  // Pagina-overgang bij interne links
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (a.target && a.target !== '_self') return;
    if (a.protocol !== location.protocol || a.host !== location.host) return;
    if (a.pathname === location.pathname) return;
    e.preventDefault();
    if (reduce) { location.href = a.href; return; }
    document.body.classList.add('leaving');
    setTimeout(function(){ location.href = a.href; }, 280);
  });
  window.addEventListener('pageshow', function(){ document.body.classList.remove('leaving'); });
})();
</script>
