a{color:inherit}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px clamp(16px,5vw,56px)}
.logo{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem;text-decoration:none;letter-spacing:.02em}
.nav{display:flex;gap:12px;flex-wrap:wrap}

.btn{display:inline-block;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.1rem;text-decoration:none;
  padding:10px 20px;border:3px solid var(--shadow);background:var(--panel);color:var(--text);
  box-shadow:5px 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--ember);color:var(--ember-ink)}

.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px clamp(16px,5vw,56px) 80px;max-width:1100px;margin:0 auto}
.creator{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px}
.clabel{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ember)}
.creator img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.cname{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem}
.creator.small{margin:0 auto 48px;padding:20px 32px;gap:10px;width:min(560px,calc(100% - 32px));background:var(--panel);border:3px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.creator.small .clabel{font-size:.95rem}
.creator.small img{width:100px;height:100px;border-width:3px;box-shadow:4px 4px 0 var(--shadow)}
.creator.small .cname{font-size:1.25rem}
.row.buttons{flex-wrap:nowrap;gap:12px;margin-top:18vh;width:100%;max-width:760px;justify-content:center}
.row.buttons .btn{flex:1 1 0;min-width:0;text-align:center;padding-left:8px;padding-right:8px}
@media (max-width:560px){.row.buttons{flex-wrap:wrap}.row.buttons .btn{flex:1 1 40%}}
.hero h1{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(3.2rem,13vw,9rem);line-height:.95;margin:0 0 24px;letter-spacing:-.01em;
  text-shadow:6px 6px 0 var(--shadow)}
.hero p{font-size:1.2rem;max-width:34ch;color:var(--muted);margin:0 0 32px}
.hint{font-family:"Pixelify Sans",monospace;color:var(--muted);margin-top:56px}

section.clients{padding:80px clamp(16px,5vw,56px) 96px}
.card{max-width:760px;margin:0 auto;background:var(--panel);border:3px solid var(--shadow);box-shadow:10px 10px 0 var(--shadow);padding:clamp(24px,5vw,48px)}
.card.socials,.card.middle,.card.rat,.card.first,.card.launchers{margin-top:48px}
.card.install{padding-top:20px;padding-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card.install h2{margin:0;font-size:clamp(1.5rem,5vw,2.2rem)}
.card.featured{margin-top:48px;text-align:center}
.creator{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.creator img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.cname{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.5rem}
.row{display:flex;gap:16px;flex-wrap:wrap}
.card h2{font-family:"Pixelify Sans",monospace;font-size:clamp(1.9rem,6vw,3rem);line-height:1.05;margin:0 0 16px}
.version{display:inline-block;background:var(--ember);color:var(--ember-ink);font-family:"Pixelify Sans",monospace;font-weight:700;padding:2px 12px;margin-bottom:20px;border:3px solid var(--shadow)}
.card p{color:var(--muted);margin:0 0 20px;max-width:52ch}
.card p.includes{color:var(--text);font-weight:700;margin-bottom:28px}

footer{text-align:center;padding:32px 16px 48px;color:var(--muted);font-size:.95rem}
footer a{color:var(--text)}




@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

.page{max-width:760px;margin:0 auto;padding:40px clamp(16px,5vw,56px) 24px}
.page h1{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(2.6rem,10vw,5rem);line-height:.95;margin:0 0 32px;text-shadow:6px 6px 0 var(--shadow)}
.page .card{margin:0 auto 40px}
.card .row{margin-top:8px}
.card .version{margin-right:8px}

/* ===== Animaties ===== */
[data-type]{white-space:nowrap}
.l{display:inline-block;animation:letterIn .32s steps(4,end) backwards;animation-delay:calc(250ms + var(--i) * 110ms)}
@keyframes letterIn{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
main{animation:pageIn .45s ease-out backwards;transition:opacity .28s ease-in,transform .28s ease-in}
header{transition:opacity .28s ease-in}
body.leaving main{opacity:0;transform:translateY(-18px)}
body.leaving header{opacity:0}
.row.buttons{animation:fadeUp .5s ease-out backwards;animation-delay:1.3s}
.creator.small{animation:fadeUp .5s ease-out backwards;animation-delay:1.6s}
.page .card{animation:fadeUp .5s ease-out backwards;animation-delay:calc(.6s + var(--n,0) * 80ms)}
@media (prefers-reduced-motion:reduce){
  .l,main,.row.buttons,.creator.small,.page .card,dialog.pop,dialog.pop::backdrop{animation:none!important}
  main,header{transition:none!important}
}

.choice{display:block;text-decoration:none;color:inherit;transition:transform .08s,box-shadow .08s}
.choice:hover{transform:translate(3px,3px);box-shadow:7px 7px 0 var(--shadow)}
.choice p{margin:0}
.lead{color:var(--muted);max-width:52ch;margin:-12px 0 32px}
.backrow{margin-bottom:28px}
.card h2.sub{font-size:clamp(1.5rem,5vw,2.2rem)}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 24px}
ol.steps li:last-child{margin-bottom:0}
ol.steps li::before{content:counter(s);grid-row:1/3;font-family:"Pixelify Sans",monospace;font-weight:700;background:var(--ember);color:var(--ember-ink);border:3px solid var(--shadow);width:2.2em;height:2.2em;display:flex;align-items:center;justify-content:center}
ol.steps h3{font-family:"Pixelify Sans",monospace;font-size:1.3rem;margin:0}
ol.steps p{margin:0;max-width:60ch}
ul.tips{margin:0;padding-left:1.2em;color:var(--muted)}
ul.tips li{margin-bottom:10px;max-width:60ch}
</style>

<script>
var N={
learn:{t:"Learn",k:["pvp","potions","building"],l:"Pick a topic and follow the tutorial."},
pvp:{p:"learn",t:"PvP",tag:"Combat",d:"Fight other players with the sword, mace, crystals or the new spear.",k:["sword","mace","cpvp","spear"],l:"Choose a fighting style."},
potions:{p:"learn",t:"Potions",tag:"Brewing",d:"Brew healing, speed, strength and more, from the first bottle to splash potions.",
i:"Potions give you a big edge in PvP and survival. Here is the full brewing process.",
s:[["Get your gear","Craft a brewing stand from 1 blaze rod and 3 cobblestone. Blaze powder is its fuel and glass bottles hold the potions. You also need nether wart, which grows in Nether fortresses."],
["Make an awkward potion","Fill glass bottles with water, then put them in the bottom slots of the stand. Add nether wart on top. This awkward potion is the base for almost every good potion."],
["Add the main ingredient","Healing: glistering melon slice. Swiftness: sugar. Strength: blaze powder. Fire resistance: magma cream. Regeneration: ghast tear. Night vision: golden carrot. Water breathing: pufferfish. Leaping: rabbit foot. Slow falling: phantom membrane. Turtle master: turtle shell. Poison: spider eye."],
["Make it stronger or longer","Redstone dust makes the effect last longer. Glowstone dust makes it stronger (level II), but the effect is shorter. You can only pick one of the two on the same potion."],
["Turn it into a weapon","Fermented spider eye corrupts a potion: swiftness becomes slowness, healing or poison becomes harming, and night vision becomes invisibility. Add gunpowder for a splash potion you can throw. Add dragon's breath to a splash potion for a lingering cloud."],
["Try the newer potions","Oozing uses a slime block, weaving a cobweb, wind charged a breeze rod and infested a stone block. They are great for utility and trap setups."]],
tips:["A good PvP kit is swiftness II, strength, fire resistance and a stack of splash healing.","Brew several bottles at once. One stand makes 3 potions per batch.","Keep blaze powder in bulk, because every batch uses fuel."]},
building:{p:"learn",t:"Building",tag:"Creative",d:"Plan, design and finish a build that looks great, step by step.",
i:"Good builds come from a few simple habits. This guide walks you through a small house you can scale up.",
s:[["Plan the build","Decide the style, the size and where it goes. Mark the outline on the ground with wool or dirt. A small house of 7 by 9 blocks and 4 blocks high is a good start."],
["Pick a palette","Use 3 or 4 blocks: one for walls, one for the frame and corners, one for the roof and one for accents. Mix in 10 to 15 percent of a similar block in the walls so they do not look flat."],
["Build the frame","Place corner pillars first, then the floor and the wall lines. Big shapes come first and details come last."],
["Add depth to the walls","Push windows one block inward. Use stairs, slabs, trapdoors, fences and buttons to break up flat walls and create trim."],
["Build the roof","Use stairs and slabs and let the roof stick out one block past the wall. A steeper roof looks more dramatic, and a shallow one looks more modern."],
["Fill the interior","Make furniture from stairs, trapdoors, carpets and barrels. Hide light sources like lanterns, glowstone behind trapdoors or sea lanterns so rooms stay bright but clean."],
["Blend it into the world","Add a path, a garden, trees and some terrain changes around the house. A build that sits on perfectly flat grass always looks unfinished."]],
tips:["Look at screenshots and real buildings for ideas, then copy the shapes, not the blocks.","Use creative mode flight for roofs and tall walls.","Do not rush the details. They make the build."]},
sword:{p:"pvp",t:"Sword",tag:"Beginner",d:"The classic. Learn timing, crits and movement.",
i:"The sword is the base of all PvP. If you master it, every other weapon gets easier.",
s:[["Get your kit","A netherite or diamond sword with Sharpness, Unbreaking and Mending. Add a shield, Protection IV armor and golden apples."],
["Respect the cooldown","Your attack meter must be full for full damage. Clicking fast does very little, so wait for the meter and hit once."],
["Land critical hits","Hit while falling after a jump (not while sprinting) to deal 50 percent extra damage."],
["Use sprint knockback","Hit while sprinting for extra knockback. Release forward just before the hit and press it again (W-tap) so every hit knocks them back."],
["Strafe and keep range","Move left and right instead of straight back. Stay around 3 blocks away so you can hit but they cannot."],
["Block and heal","Use your shield when they charge in, but remember axes disable it for a few seconds. Back off to eat a golden apple when you are low."]],
tips:["Practice in 1v1 duels with a friend.","Watch your hunger, since a low food bar stops sprinting.","Repair gear with Mending so you do not run out mid-fight."]},
mace:{p:"pvp",t:"Mace",tag:"1.21",d:"Fall from above and smash for huge damage.",
i:"The mace gets stronger the farther you fall before you hit. One good smash can change a fight.",
s:[["Get a mace","You cannot find it directly. Craft it from a heavy core and a breeze rod. Heavy cores come from ominous vaults in Trial Chambers."],
["Learn the smash attack","Hit an enemy after falling more than 1.5 blocks. Damage grows with every block you fell, and you take no fall damage from the hit."],
["Pick your enchants","Density adds damage per block fallen. Breach cuts the armor protection of the target. Wind Burst launches you back up after a smash. Density and Breach cannot be combined."],
["Launch yourself","Use a wind charge at your feet to shoot into the air, then fall onto your target and aim for their head."],
["Follow up","On the ground the mace is slow. Switch to a sword or keep chaining with Wind Burst to avoid giving them free hits."]],
tips:["Counter a mace player by staying mobile and not standing still under them.","Missing a smash means taking fall damage, so look for a landing spot first.","Keep a water bucket or a second weapon for emergencies."]},
cpvp:{p:"pvp",t:"CPvP",tag:"Advanced",d:"Crystal PvP with end crystals, obsidian and totems.",
i:"Crystal PvP is fast and deadly. Explosions do the damage, so gear and timing decide who wins.",
s:[["Pack your kit","Netherite armor with Protection IV or Blast Protection IV, totems of undying, obsidian, end crystals, golden apples, ender pearls and a sword."],
["Set your hotbar","Put a totem in your offhand. Keep sword, obsidian, crystals and golden apples in fixed slots so you never need to search."],
["Place obsidian","End crystals can only be placed on obsidian or bedrock. Put obsidian next to or under your enemy."],
["Place and detonate","Place a crystal on that obsidian and hit it right away. The explosion hurts everyone close, you included, so step back first."],
["Manage totems","When a totem pops, put a new one in your offhand immediately and eat a golden apple. Never go into a fight without spares."],
["Defend yourself","Block incoming crystals with obsidian and hit enemy crystals before they explode."]],
tips:["Blocks between you and a crystal reduce the blast damage.","Low ping gives a huge advantage, so train in a private world first.","Check that the server actually allows crystal PvP."]},
spear:{p:"pvp",t:"Spear",tag:"1.21.11",d:"Jab, charge and lunge with the newest weapon.",
i:"The spear has two attacks, a weak jab and a strong charge, and it can hit more than one enemy.",
s:[["Get a spear","Craft it from a material and sticks, and use a better material for more damage and durability."],
["Jab","Press attack. It does low damage with knockback and needs a full attack meter, but it can hit several targets."],
["Charge","Hold the use button. The damage depends on how fast you move relative to the target, so sprint, ride a horse or lunge at them."],
["Time the charge","A charge has an engaged, tired and disengaged stage. Your best hits come early, so close the gap first and then hold."],
["Add Lunge","Lunge (up to level III) makes your jab push you forward. It costs hunger and durability and does not work in water or with an elytra."],
["Chain your attacks","You can start a charge while the jab is on cooldown. Jab, then charge, then repeat."]],
tips:["Spears do not land critical hits, so skip the jump timing.","Keep your hunger above 6 if you use Lunge.","Spears work great on horseback."]}
};
var view=document.getElementById("view");
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function typeIt(h,text){h.setAttribute("aria-label",text);text.split("").forEach(function(ch,i){var s=el("span","l",ch);s.setAttribute("aria-hidden","true");s.style.setProperty("--i",i);h.appendChild(s)})}
function render(){
  var id=location.hash.slice(1);if(!N[id])id="learn";
  var n=N[id],c=0;view.textContent="";document.title=n.t+" - Deathzkind";
  function add(e){e.style.setProperty("--n",c++);view.appendChild(e)}
  if(n.p){var r=el("div","backrow");var b=el("a","btn","Back");b.href="#"+n.p;r.appendChild(b);view.appendChild(r)}
  var h=el("h1");h.setAttribute("data-type","");typeIt(h,n.t);view.appendChild(h);
  if(n.k){
    view.appendChild(el("p","lead",n.l));
    n.k.forEach(function(k){var x=N[k],a=el("a","card choice");a.href="#"+k;a.appendChild(el("span","version",x.tag));a.appendChild(el("h2","",x.t));a.appendChild(el("p","",x.d));add(a)});
  }else{
    var i=el("div","card");i.appendChild(el("p","",n.i));add(i);
    var s=el("div","card");s.appendChild(el("h2","sub","Step by step"));var ol=el("ol","steps");
    n.s.forEach(function(p){var li=el("li");li.appendChild(el("h3","",p[0]));li.appendChild(el("p","",p[1]));ol.appendChild(li)});
    s.appendChild(ol);add(s);
    var t=el("div","card");t.appendChild(el("h2","sub","Tips"));var ul=el("ul","tips");
    n.tips.forEach(function(x){ul.appendChild(el("li","",x))});t.appendChild(ul);add(t);
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);render();
(function(){
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a[href]");
    if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    if(a.target&&a.target!=="_self")return;
    if(a.protocol!==location.protocol||a.host!==location.host)return;
    if(a.pathname===location.pathname)return;
    e.preventDefault();
    if(reduce){location.href=a.href;return}
    document.body.classList.add("leaving");
    setTimeout(function(){location.href=a.href},280);
  });
  window.addEventListener("pageshow",function(){document.body.classList.remove("leaving")});
})();
</script>
